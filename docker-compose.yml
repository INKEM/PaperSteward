services:
  papersteward:
    build: .
    image: papersteward:dev
    init: true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PAPERSTEWARD_APP_ENV: prod
      PAPERSTEWARD_DATA_DIR: /app/var
      PAPERSTEWARD_LOG_FORMAT: json
      PAPERSTEWARD_LOG_LEVEL: INFO
      PAPERSTEWARD_TIMEZONE: Asia/Shanghai
      PAPERSTEWARD_LLM_PROVIDER: ${PAPERSTEWARD_LLM_PROVIDER:-fake}
      PAPERSTEWARD_LLM_BASE_URL: ${PAPERSTEWARD_LLM_BASE_URL:-https://api.openai.com/v1}
      PAPERSTEWARD_LLM_MODEL: ${PAPERSTEWARD_LLM_MODEL:-}
      PAPERSTEWARD_LLM_API_KEY: ${PAPERSTEWARD_LLM_API_KEY:-}
      PAPERSTEWARD_SEMANTIC_SCHOLAR_API_KEY: ${PAPERSTEWARD_SEMANTIC_SCHOLAR_API_KEY:-}
    volumes:
      - papersteward_data:/app/var
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  papersteward_data:
