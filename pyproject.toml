[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "papersteward"
dynamic = ["version"]
description = "本地优先的文献自动挖掘、优先级排序与每日推送系统"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "pydantic>=2.9,<3.0",
  "pydantic-settings>=2.5,<3.0",
  "uvicorn>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "mypy>=1.11,<2.0",
  "pytest>=8.0,<10.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.dynamic]
version = { attr = "papersteward.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "contract: 契约测试",
  "integration: 需要数据库或临时文件系统的集成测试",
  "e2e: 端到端测试",
  "live: 访问真实网络或模型，默认不在 CI 运行",
]

[tool.coverage.run]
source = ["papersteward"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "DTZ", "LOG", "G"]

[tool.ruff.lint.isort]
known-first-party = ["papersteward"]

[tool.mypy]
python_version = "3.11"
files = ["src/papersteward"]
mypy_path = "src"
strict = true
plugins = ["pydantic.mypy"]
